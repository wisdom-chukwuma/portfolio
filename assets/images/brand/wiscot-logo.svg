<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <!-- Triangle (Top-Left) -->
  <polygon points="10,35 20,15 30,35" fill="none" stroke="#666" stroke-width="2.5"/>

  <!-- Circle (Top-Right) -->
  <circle cx="60" cy="25" r="10" fill="none" stroke="#666" stroke-width="2.5"/>

  <!-- Square (Bottom-Left) -->
  <rect x="10" y="50" width="20" height="20" fill="none" stroke="#666" stroke-width="2.5"/>

  <!-- X Shape (Bottom-Right) -->
  <g stroke="#666" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="50" x2="70" y2="70" />
    <line x1="70" y1="50" x2="50" y2="70" />
  </g>
</svg>
